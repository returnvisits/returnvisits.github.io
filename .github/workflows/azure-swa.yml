name: Azure Static Web Apps deploy

# Runs ALONGSIDE GitHub Pages during the migration transition.
# Pages keeps serving returnvisits.org until the DNS cutover to SWA;
# this workflow keeps the SWA copy of the site current in parallel.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to SWA (rv-prod-web)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          action: upload
          app_location: "/"
          output_location: ""
          skip_app_build: true # pure static site — no build step
